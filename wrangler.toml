name = "venstock"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# public/ is served as static files through the ASSETS binding.
# run_worker_first: the Worker sees every request (needed to refuse unknown vendor subdomains).
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[dev]
port = 8788

# Vendors live at <slug>.<BASE_DOMAIN>; the platform admin at admin.<BASE_DOMAIN>.
# BASE_DOMAIN here is the PRODUCTION vendor domain. Local configs always use "localhost" (<slug>.localhost:8788), so
# this value only matters for deploys. Every remote command refuses until it is a real domain AND a wildcard route
# for it exists below (you set both, not Claude; see docs/before-first-vendor.md):
#   [[routes]]
#   pattern = "*.venstock.org/*"
#   zone_name = "venstock.org"
[vars]
BASE_DOMAIN = "venstock.org"

# The control database: the vendor registry and Venstock staff. Vendor databases (DB_T<id>) are never listed here;
# scripts write them into .wrangler-generated/ from the registry. Remote name must stay venstock-dev-control; set
# database_id after creating it (you, not Claude).
[[d1_databases]]
binding = "venstock-dev-control"
database_name = "venstock-dev-control"
database_id = "6001083c-18ca-4c72-a083-908292b4d05b"
