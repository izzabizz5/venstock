name = "venstock"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# public/ is served as static files through the ASSETS binding.
# run_worker_first: the Worker sees every request (needed to refuse unknown vendor subdomains).
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[dev]
port = 8788

[[d1_databases]]
binding = "DB"
database_name = "<>"
database_id = "<>"
