name = "venstock"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# public/ is served as static files through the ASSETS binding.
# run_worker_first: the Worker sees every request (needed to refuse unknown vendor subdomains).
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[dev]
port = 8788

# Vendors live at <slug>.<BASE_DOMAIN>. Locally that is <slug>.localhost:8788. Set the real domain before any deploy
# (you, not Claude); with "localhost" deployed, every request would answer 404.
[vars]
BASE_DOMAIN = "localhost"

# The control database: the vendor registry and Venstock staff. Vendor databases (DB_T<id>) are never listed here;
# scripts write them into .wrangler-generated/ from the registry. Remote name must stay venstock-dev-control; set
# database_id after creating it (you, not Claude).
[[d1_databases]]
binding = "CONTROL"
database_name = "venstock-dev-control"
database_id = "<>"
