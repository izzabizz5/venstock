<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Venstock</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply light/dark before the page draws (saved choice, otherwise the device setting).
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("theme")); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <strong>Venstock</strong>
      <span id="showName" class="muted">No show running</span>
    </div>
    <nav id="tabs">
      <button data-tab="sell">Sell</button>
      <button data-tab="sales">Sales</button>
      <button data-tab="items">Items</button>
      <button data-tab="shows">Shows</button>
      <button data-tab="account">Account</button>
    </nav>
    <span id="sync"></span>
    <button id="themeToggle" data-toggletheme aria-label="Switch to dark mode" title="Dark mode">🌙</button>
  </header>
  <main id="view"></main>
  <div id="modal" class="modal-wrap" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/vendor/qrcode.js"></script>
  <script src="/sync.js"></script>
  <script src="/app.js"></script>
</body>
</html>
